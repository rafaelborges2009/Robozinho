<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Robô Interativo</title>

<style>

:root {
    --eye-white: #f0faff;
    --dark-bg: #050505;
    --glow-soft: rgba(240,250,255,0.15);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: var(--dark-bg);

    overflow: hidden;

    touch-action: manipulation;

    overscroll-behavior: none;

    user-select: none;
    -webkit-user-select: none;

}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    min-height: 100dvh;

}


/* =========================================
   ORIENTAÇÃO
========================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    background: #000;

    color: white;

    z-index: 99999;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    font-family: Arial,sans-serif;

}

#orientation-overlay div {

    font-size: 50px;

}

#orientation-overlay p {

    font-size: 18px;

}

@media (orientation:portrait) {

    #orientation-overlay {

        display:flex;

    }

}


/* =========================================
   ROSTO
========================================= */

.face-container {

    display:flex;

    justify-content:center;

    align-items:center;

    width:100vw;

    height:100vh;

    animation:float 5s ease-in-out infinite;

}

@keyframes float {

    0%,100% {

        transform:translateY(0);

    }

    50% {

        transform:translateY(-12px);

    }

}


/* =========================================
   OLHOS
========================================= */

.eyes-row {

    display:flex;

    align-items:center;

    justify-content:center;

    gap:clamp(60px,11vw,160px);

    width:100vw;

}


.eye {

    width:clamp(170px,22vw,330px);

    height:clamp(150px,20vw,290px);

    background:var(--eye-white);

    border-radius:80px;

    box-shadow:

        0 0 30px var(--glow-soft),

        0 0 70px rgba(240,250,255,0.07);

    transition:

        all .4s cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        );

}


/* =========================================
   EXPRESSÃO DORMINDO
========================================= */

.sleeping .eye {

    width:clamp(140px,18vw,260px);

    height:8px;

    opacity:.2;

    border-radius:4px;

}


/* =========================================
   EXPRESSÃO FELIZ
========================================= */

.happy .eye {

    height:clamp(70px,10vw,130px);

    background:transparent;

    border-top:

        clamp(18px,2.5vw,30px)

        solid var(--eye-white);

    border-radius:

        100px 100px 0 0;

    box-shadow:none;

    transform:translateY(25px);

}


/* =========================================
   EXPRESSÃO PENSANDO
========================================= */

.thinking #eye-l {

    width:clamp(170px,22vw,330px);

    height:clamp(150px,20vw,290px);

}

.thinking #eye-r {

    width:clamp(170px,22vw,330px);

    height:clamp(100px,15vw,210px);

}


/* =========================================
   EXPRESSÃO RINDO
========================================= */

.laughing .eye {

    width:clamp(170px,22vw,330px);

    height:clamp(40px,6vw,75px);

    transform:skewX(10deg);

}


/* =========================================
   PISCADA
========================================= */

.blink .eye {

    transform:scaleY(0)!important;

}


/* =========================================
   RESPONSIVIDADE
========================================= */

@media (orientation:landscape) {

    .eye {

        width:22vw;

        height:20vw;

        max-width:330px;

        max-height:290px;

    }

}


@media (max-height:500px) and (orientation:landscape) {

    .eye {

        width:20vw;

        height:17vw;

        max-width:270px;

        max-height:225px;

    }

    .eyes-row {

        gap:10vw;

    }

}


#status {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 90000;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(0,0,0,.62);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.78);
    font: 13px/1.2 Arial, sans-serif;
    pointer-events: none;
    backdrop-filter: blur(8px);
}

.speaking .eye {
    transform: scaleY(.88);
    box-shadow:
        0 0 34px rgba(240,250,255,.2),
        0 0 90px rgba(240,250,255,.08);
}

.listening .eye {
    transform: scale(1.03);
    box-shadow:
        0 0 42px rgba(240,250,255,.24),
        0 0 110px rgba(240,250,255,.1);
}

.attentive .eye {
    transform: scale(1.015);
}

.thinking .eye {
    opacity: .82;
}

.surprised .eye {
    transform: scale(1.08);
    border-radius: 55px;
    box-shadow:
        0 0 48px rgba(240,250,255,.25),
        0 0 120px rgba(240,250,255,.12);
}

</style>

</head>


<body class="sleeping">

<div id="status">Toque na tela para começar...</div>

<div id="orientation-overlay">
    <div>📱🔄</div>
    <p>Gire o dispositivo para deitado.</p>
</div>

<div class="face-container" id="robot-face">
    <div class="eyes-row">
        <div id="eye-l" class="eye"></div>
        <div id="eye-r" class="eye"></div>
    </div>
</div>

<script>
const body = document.body;
const robotFace = document.getElementById("robot-face");
const statusEl = document.getElementById("status");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SpeechRecognition ? new SpeechRecognition() : null;

let audioCtx = null;
let wakeLock = null;
let voices = [];

let robotSpeaking = false;
let listeningForUser = false;
let processingUser = false;
let conversationStarted = false;
let sessionFinished = false;
let recognitionStarting = false;

let currentStep = "name";
let userName = "";

let listenTimer = null;
let safetyTimer = null;
let speechTimer = null;
let finishTimer = null;

const THINKING_TIME = 900;
const MIN_SPEECH_LENGTH = 2;
const MAX_LISTEN_TIME = 15000;

if (recognition) {
    recognition.lang = "pt-BR";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        recognitionStarting = false;
        listeningForUser = true;
        body.className = "listening";
        setStatus("Estou ouvindo você...");
        iniciarSafetyTimer();
    };

    recognition.onresult = event => {
        if (sessionFinished || robotSpeaking || processingUser || !listeningForUser) return;

        const result = event.results?.[0];
        if (!result || !result.isFinal) return;

        const item = result[0];
        const texto = (item?.transcript || "").trim();
        const confidence = typeof item?.confidence === "number" ? item.confidence : 1;

        limparTimersDeEscuta();
        listeningForUser = false;

        if (!texto || texto.length < MIN_SPEECH_LENGTH || confidence < 0.15) {
            body.className = "attentive";
            setStatus("Não entendi. Pode falar novamente?");
            scheduleListening(700);
            return;
        }

        processarResposta(texto);
    };

    recognition.onerror = event => {
        recognitionStarting = false;
        listeningForUser = false;
        limparSafetyTimer();

        if (sessionFinished || robotSpeaking || processingUser) return;

        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            body.className = "sleeping";
            setStatus("O microfone foi bloqueado. Permita o acesso ao microfone no navegador e toque em continuar.");
            showStartOverlay("Permita o microfone no navegador e toque em INICIAR CONVERSA para continuar.");
            return;
        }

        if (event.error === "audio-capture") {
            body.className = "sleeping";
            setStatus("Não foi possível acessar o microfone.");
            showStartOverlay("Verifique se outro aplicativo está usando o microfone e toque em continuar.");
            return;
        }

        if (event.error === "network") {
            body.className = "attentive";
            setStatus("O reconhecimento de voz teve uma falha de conexão.");
            scheduleListening(1400);
            return;
        }

        if (event.error === "no-speech") {
            body.className = "attentive";
            setStatus("Não ouvi nada. Quando quiser, fale.");
            scheduleListening(700);
            return;
        }

        if (event.error === "aborted") {
            if (!robotSpeaking && !processingUser && !sessionFinished) {
                body.className = "attentive";
                scheduleListening(700);
            }
            return;
        }

        body.className = "attentive";
        setStatus("Não consegui ouvir. Tente novamente.");
        scheduleListening(1000);
    };

    recognition.onend = () => {
        recognitionStarting = false;
        listeningForUser = false;
        limparSafetyTimer();

        if (!processingUser && !robotSpeaking && !sessionFinished) {
            body.className = conversationStarted ? "attentive" : "sleeping";
        }
    };
}

function setStatus(text) {
    if (statusEl) statusEl.textContent = text;
}

function inicializarAudioContext() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
        }
    } catch (e) {}
}

function tocarSomRobotico(tipo) {
    try {
        inicializarAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (tipo === "bip") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);

            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        if (tipo === "processando") {
            [600, 850, 1100].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const start = now + index * 0.09;

                osc.type = "square";
                osc.frequency.setValueAtTime(freq, start);

                gain.gain.setValueAtTime(0.05, start);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.07);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.07);
            });
        }
    } catch (e) {}
}

function carregarVozes() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}

carregarVozes();

if (window.speechSynthesis && "onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = carregarVozes;
}

function encontrarMelhorVoz() {
    carregarVozes();

    const preferidos = [
        "google português do brasil",
        "luciana",
        "felipe",
        "daniel",
        "ricardo"
    ];

    let voz = voices.find(v => {
        const nome = v.name.toLowerCase();
        const idioma = v.lang.toLowerCase();
        return idioma.startsWith("pt-br") && preferidos.some(p => nome.includes(p));
    });

    if (!voz) {
        voz = voices.find(v => v.lang.toLowerCase().startsWith("pt-br"));
    }

    if (!voz) {
        voz = voices.find(v => v.lang.toLowerCase().startsWith("pt"));
    }

    return voz || null;
}

async function manterTelaAcesa() {
    try {
        if (!("wakeLock" in navigator)) return;

        if (wakeLock && !wakeLock.released) return;

        wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) {}
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && conversationStarted && !sessionFinished) {
        manterTelaAcesa();
    }
});

function limparSafetyTimer() {
    if (safetyTimer) {
        clearTimeout(safetyTimer);
        safetyTimer = null;
    }
}

function limparTimersDeEscuta() {
    if (listenTimer) {
        clearTimeout(listenTimer);
        listenTimer = null;
    }

    limparSafetyTimer();
}

function cancelarReconhecimento() {
    limparTimersDeEscuta();
    recognitionStarting = false;
    listeningForUser = false;

    if (!recognition) return;

    try {
        recognition.abort();
    } catch (e) {}

    try {
        recognition.stop();
    } catch (e) {}
}

function iniciarSafetyTimer() {
    limparSafetyTimer();

    safetyTimer = setTimeout(() => {
        if (!listeningForUser || processingUser || robotSpeaking || sessionFinished) return;

        try {
            recognition.stop();
        } catch (e) {}

        listeningForUser = false;
        body.className = "attentive";
        setStatus("Estou aguardando sua resposta...");
        scheduleListening(700);
    }, MAX_LISTEN_TIME);
}

function scheduleListening(delay = 600) {
    if (sessionFinished || robotSpeaking || processingUser) return;
    if (!recognition) return;
    if (!conversationStarted) return;
    if (listeningForUser || recognitionStarting) return;

    if (listenTimer) {
        clearTimeout(listenTimer);
    }

    listenTimer = setTimeout(() => {
        listenTimer = null;
        iniciarEscuta();
    }, delay);
}

function iniciarEscuta() {
    if (
        !recognition ||
        sessionFinished ||
        robotSpeaking ||
        processingUser ||
        listeningForUser ||
        recognitionStarting
    ) {
        return;
    }

    if (!document.fullscreenElement) {
        showStartOverlay("A conversa precisa continuar em tela cheia. Toque em INICIAR CONVERSA para continuar.");
        body.className = "sleeping";
        setStatus("Aguardando tela cheia...");
        return;
    }

    recognitionStarting = true;
    body.className = "listening";
    setStatus("Estou ouvindo você...");

    try {
        recognition.start();
    } catch (error) {
        recognitionStarting = false;

        if (error?.name === "InvalidStateError") {
            return;
        }

        body.className = "attentive";
        setStatus("Estou pronto. Fale quando quiser.");
        scheduleListening(1000);
    }
}

function estimarDuracaoDaFala(texto) {
    const palavras = texto.trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1800, Math.min(20000, palavras * 350));
}

function falar(texto) {
    return new Promise(resolve => {
        robotSpeaking = true;
        processingUser = false;
        listeningForUser = false;

        cancelarReconhecimento();

        if (speechTimer) clearTimeout(speechTimer);
        if (finishTimer) clearTimeout(finishTimer);

        body.className = "speaking";
        setStatus("O robô está falando...");
        tocarSomRobotico("bip");

        if (!window.speechSynthesis) {
            robotSpeaking = false;
            body.className = "attentive";
            setStatus("Agora é sua vez.");
            resolve();
            return;
        }

        window.speechSynthesis.cancel();

        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = "pt-BR";
        msg.pitch = 0.6;
        msg.rate = 0.9;
        msg.volume = 1;

        const voz = encontrarMelhorVoz();
        if (voz) msg.voice = voz;

        let finalizado = false;

        const finalizar = () => {
            if (finalizado) return;
            finalizado = true;

            if (speechTimer) clearTimeout(speechTimer);
            if (finishTimer) clearTimeout(finishTimer);

            robotSpeaking = false;

            if (!sessionFinished) {
                body.className = "attentive";
                setStatus("Agora é sua vez.");
            }

            resolve();
        };

        msg.onstart = () => {
            robotSpeaking = true;
            body.className = "speaking";
        };

        msg.onend = finalizar;
        msg.onerror = finalizar;

        speechTimer = setTimeout(finalizar, estimarDuracaoDaFala(texto) + 3500);

        finishTimer = setTimeout(() => {
            if (!finalizado) {
                try {
                    window.speechSynthesis.cancel();
                } catch (e) {}
                finalizar();
            }
        }, estimarDuracaoDaFala(texto) + 5000);

        setTimeout(() => {
            if (finalizado) return;

            try {
                window.speechSynthesis.speak(msg);
            } catch (e) {
                finalizar();
            }
        }, 180);
    });
}

function esperar(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function normalizar(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function extrairNome(texto) {
    let limpo = normalizar(texto)
        .replace(/\bmeu nome e\b/g, "")
        .replace(/\beu me chamo\b/g, "")
        .replace(/\bme chamo\b/g, "")
        .replace(/\beu sou\b/g, "")
        .replace(/\bsou\b/g, "")
        .trim();

    const proibidos = new Set([
        "oi", "ola", "sim", "nao", "bom", "dia",
        "tarde", "noite", "meu", "nome"
    ]);

    const partes = limpo.split(/\s+/).filter(Boolean);

    const nomes = partes.filter(parte =>
        parte.length >= 2 && !proibidos.has(parte)
    );

    if (!nomes.length) return "";

    return nomes.slice(0, 3)
        .map(parte => parte.charAt(0).toUpperCase() + parte.slice(1))
        .join(" ");
}

function analisarResposta(texto) {
    const n = normalizar(texto);

    const grupos = [
        ["felicidade", ["feliz", "felicidade", "alegria", "prazer", "bem estar"]],
        ["relacionamentos", ["amor", "amizade", "familia", "pessoas", "relacao", "relacionamento"]],
        ["liberdade", ["liberdade", "livre", "escolha", "escolher"]],
        ["verdade", ["verdade", "realidade", "certeza", "fato", "mentira"]],
        ["sentido", ["sentido", "proposito", "significado", "objetivo", "vida"]],
        ["conhecimento", ["conhecimento", "aprender", "estudar", "saber", "curiosidade"]],
        ["tecnologia", ["inteligencia artificial", "ia", "tecnologia", "robo", "algoritmo", "maquina"]],
        ["duvida", ["duvida", "incerteza", "talvez", "depende", "nao sei", "nao tenho certeza"]],
        ["moral", ["certo", "errado", "moral", "etica", "justo", "injusto"]]
    ];

    const temas = [];

    for (const [nome, palavras] of grupos) {
        if (palavras.some(p => n.includes(p))) {
            temas.push(nome);
        }
    }

    return {
        textoOriginal: texto.trim(),
        temas,
        tamanho: texto.trim().split(/\s+/).filter(Boolean).length,
        primeiraPessoa: /\b(eu|meu|minha|acho|penso|acredito|sinto|prefiro|quero)\b/i.test(texto),
        certeza: /\b(tenho certeza|com certeza|obvio|claro que sim|certamente)\b/i.test(texto),
        duvida: /\b(nao sei|não sei|talvez|depende|nao tenho certeza|não tenho certeza)\b/i.test(texto),
        negacao: /\b(nao|não|nunca|jamais)\b/i.test(texto)
    };
}

function escolherTemaPrincipal(info) {
    return info.temas[0] || "aberto";
}

function construirResposta(info, etapa) {
    const tema = escolherTemaPrincipal(info);
    const trecho = info.textoOriginal.length > 110
        ? info.textoOriginal.slice(0, 110) + "..."
        : info.textoOriginal;

    if (etapa === "vida") {
        if (tema === "felicidade") {
            return `Entendi. Para você, a felicidade tem um papel importante em uma vida boa. Mas quero aprofundar: uma vida pode continuar sendo boa mesmo quando passa por momentos difíceis, ou a felicidade é indispensável?`;
        }

        if (tema === "relacionamentos") {
            return `Você colocou as relações humanas no centro da sua resposta. Isso levanta uma questão interessante: até que ponto precisamos das outras pessoas para construir a nossa própria ideia de uma vida boa?`;
        }

        if (tema === "liberdade") {
            return `Você trouxe a ideia de liberdade. Então quero ir um pouco além: ser livre é poder escolher qualquer coisa ou também é entender por que fazemos determinadas escolhas?`;
        }

        if (tema === "sentido") {
            return `Você falou sobre sentido, e essa é uma das perguntas mais antigas da filosofia. O sentido da vida existe por si mesmo ou cada pessoa precisa construir um significado para a própria existência?`;
        }

        return `Entendi. Você disse: "${trecho}". O que fez você chegar a essa conclusão? Quero entender o raciocínio por trás da sua resposta.`;
    }

    if (etapa === "verdade") {
        if (info.duvida || tema === "duvida") {
            return `Você deixou espaço para a dúvida. Isso é importante porque reconhecer que podemos estar errados muda a forma como pensamos. O que poderia fazer você mudar de ideia sobre algo que hoje considera verdadeiro?`;
        }

        if (tema === "verdade" || info.certeza) {
            return `Você parece confiar na ideia de que podemos alcançar algum tipo de verdade. Mas como você diferenciaria algo realmente verdadeiro de algo que apenas parece verdadeiro porque acreditamos muito nisso?`;
        }

        return `Sua resposta aponta para uma questão importante. Quando você diz "${trecho}", está falando de algo que poderia ser demonstrado para qualquer pessoa ou de algo que depende da perspectiva de quem observa?`;
    }

    if (etapa === "escolha") {
        if (tema === "felicidade") {
            return `Você colocou a felicidade em destaque. Agora imagine que essa felicidade dependesse de uma mentira e que você descobrisse isso muitos anos depois. Você ainda consideraria aquela vida uma boa vida? Por quê?`;
        }

        if (tema === "verdade") {
            return `Você valorizou a verdade. Mas e se conhecer a verdade trouxesse sofrimento para você ou para alguém que você ama? Você ainda escolheria conhecê-la?`;
        }

        if (info.negacao) {
            return `Você não aceitou o dilema exatamente como foi apresentado. Isso é interessante. Você acha que, em filosofia, pensar melhor também significa questionar as próprias opções que recebemos?`;
        }

        return `Você tomou uma posição própria. Quero entender o princípio por trás dela: qual valor teve mais peso na sua decisão?`;
    }

    if (etapa === "pensamento") {
        if (tema === "moral") {
            return `Você trouxe uma questão moral. Então quero chegar ao centro dela: uma ação é certa por causa da intenção, por causa da consequência, ou existem valores que deveriam valer independentemente do resultado?`;
        }

        if (tema === "conhecimento") {
            return `Você relacionou sua resposta ao conhecimento. Quanto mais aprendemos, ganhamos mais certezas ou percebemos ainda mais coisas que não sabemos?`;
        }

        if (tema === "duvida") {
            return `Você não tratou a questão como algo simples. Quando você não tem certeza sobre alguma coisa, o que faz você escolher um caminho mesmo assim?`;
        }

        return `Quero seguir a sua linha de pensamento, não substituir sua resposta por uma pronta. Quando você tenta explicar essa ideia para outra pessoa, qual parte é mais difícil de justificar?`;
    }

    if (etapa === "final") {
        if (tema === "tecnologia" || info.temas.includes("conhecimento")) {
            return `Você trouxe tecnologia para a conversa, então quero terminar com uma questão ética: a inteligência artificial pode ajudar a pesquisar e aprender, mas também pode fazer alguém parar de pensar por conta própria. Onde você colocaria esse limite?`;
        }

        if (tema === "verdade" || tema === "duvida") {
            return `Sua resposta voltou para a relação entre certeza e dúvida. Talvez filosofar não seja eliminar toda dúvida, mas aprender a questionar sem aceitar qualquer resposta automaticamente. Como você decide em quais ideias confiar?`;
        }

        return `Você foi construindo sua própria posição durante a conversa. Agora quero conectar filosofia e tecnologia: de que maneira a inteligência artificial poderia ajudar uma pessoa a pensar melhor sem decidir por ela o que deve pensar?`;
    }

    return `Eu ouvi você. Em vez de encaixar sua fala em uma resposta pronta, quero continuar a partir dela: que ideia mais profunda está por trás do que você acabou de dizer?`;
}

function respostaFinal(info) {
    if (info.temas.includes("liberdade")) {
        return `Faz sentido. Você voltou à ideia de liberdade. Então deixo uma última provocação: quanto das nossas escolhas realmente nasce de nós e quanto é moldado pela nossa história, pelas outras pessoas e pelas circunstâncias?`;
    }

    if (info.duvida) {
        return `Entendi. Você reconheceu que não tem certeza. O que você precisaria compreender melhor para formar uma opinião mais firme?`;
    }

    return `Entendi o que você quis dizer. Talvez o mais interessante nesta conversa não seja encontrar uma resposta perfeita, mas perceber como o nosso próprio pensamento muda quando começamos a questioná-lo. Que conclusão você levaria desta conversa para a sua própria vida?`;
}

async function processarResposta(fala) {
    if (!fala || sessionFinished || robotSpeaking || processingUser || listeningForUser) return;

    processingUser = true;
    lastUserSpeech = fala;

    cancelarReconhecimento();

    const info = analisarResposta(fala);

    body.className = "thinking";
    setStatus("Estou pensando sobre o que você disse...");
    tocarSomRobotico("processando");

    await esperar(THINKING_TIME);

    if (sessionFinished) return;

    let resposta = "";
    let proximoPasso = currentStep;

    if (currentStep === "name") {
        const nome = extrairNome(fala);

        if (!nome) {
            processingUser = false;
            body.className = "attentive";
            setStatus("Preciso saber seu nome.");
            await falar("Eu não consegui identificar seu nome. Pode me dizer seu nome novamente?");
            scheduleListening(700);
            return;
        }

        userName = nome;
        proximoPasso = "vida";
        resposta = `Prazer em conhecer você, ${userName}. Quero uma conversa filosófica de verdade, baseada no que você pensa. Para começar: o que faz uma vida valer a pena para você?`;
    } else if (currentStep === "vida") {
        resposta = construirResposta(info, "vida");
        proximoPasso = "verdade";
    } else if (currentStep === "verdade") {
        resposta = construirResposta(info, "verdade");
        proximoPasso = "escolha";
    } else if (currentStep === "escolha") {
        resposta = construirResposta(info, "escolha");
        proximoPasso = "pensamento";
    } else if (currentStep === "pensamento") {
        resposta = construirResposta(info, "pensamento");
        proximoPasso = "final";
    } else if (currentStep === "final") {
        resposta = respostaFinal(info);
        proximoPasso = "encerramento";
    }

    await falar(resposta);

    currentStep = proximoPasso;
    processingUser = false;

    if (currentStep === "encerramento") {
        sessionFinished = true;
        cancelarReconhecimento();
        body.className = "sleeping";
        setStatus("Conversa encerrada.");
        return;
    }

    scheduleListening(800);
}

async function iniciarConversa() {
    inicializarAudioContext();

    if (!recognition) {
        showStartOverlay("Seu navegador não oferece reconhecimento de voz. Use o Google Chrome.");
        setStatus("Reconhecimento de voz indisponível.");
        return;
    }

    try {
        if (!document.fullscreenElement) {
            if (!document.documentElement.requestFullscreen) {
                throw new Error("Fullscreen API indisponível");
            }
            await document.documentElement.requestFullscreen();
        }
    } catch (e) {
        setStatus("Toque no rosto do robô para continuar em tela cheia.");
        setStatus("Tela cheia não autorizada.");
        return;
    }

    await manterTelaAcesa();
    
    if (conversationStarted && !sessionFinished) {
        if (!robotSpeaking && !processingUser && !listeningForUser && !recognitionStarting) {
            body.className = "attentive";
            setStatus("Tela cheia ativa. Estou pronto para ouvir.");
            scheduleListening(500);
        }
        return;
    }

    conversationStarted = true;
    sessionFinished = false;
    currentStep = "name";
    userName = "";
    robotSpeaking = false;
    processingUser = false;
    listeningForUser = false;
    recognitionStarting = false;

    setStatus("Conversa iniciada.");

    await falar("Olá. Eu sou seu parceiro de conversa sobre filosofia. Vou ouvir o que você disser, pensar sobre a sua resposta e seguir a conversa a partir dela. Primeiro, quero saber seu nome.");

    scheduleListening(900);
}

let startBusy = false;

robotFace.addEventListener("click", async () => {
    if (startBusy) return;
    startBusy = true;
    try {
        await iniciarConversa();
    } finally {
        setTimeout(() => {
            startBusy = false;
        }, 700);
    }
});

document.addEventListener("fullscreenchange", () => {
    if (!conversationStarted || sessionFinished) return;

    if (!document.fullscreenElement) {
        cancelarReconhecimento();

        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }

        setStatus("Toque no rosto do robô para voltar à tela cheia.");
        body.className = "sleeping";
        setStatus("Aguardando tela cheia...");
        return;
    }

    
    if (!robotSpeaking && !processingUser && !listeningForUser && !recognitionStarting) {
        body.className = "attentive";
        setStatus("Tela cheia ativa. Vamos continuar.");
        scheduleListening(600);
    }
});

setInterval(() => {
    if (!conversationStarted || sessionFinished || body.classList.contains("sleeping")) return;

    body.classList.add("blink");

    setTimeout(() => {
        body.classList.remove("blink");
    }, 150);
}, 4200);

document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());
</script>
